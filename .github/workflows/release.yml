name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version + publish
    runs-on: ubuntu-latest
    # Trusted Publishing: id-token: write lets npm CLI 11.5.1+ exchange a
    # short-lived OIDC token for an npm credential. No NPM_TOKEN secret needed.
    # contents: write is for changesets to push tags and the Version Packages PR.
    # pull-requests: write is for opening the Version Packages PR.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Installs (and caches) node and yarn exactly as pinned in mise.toml,
      # ahead of the runner's own on PATH.
      - uses: jdx/mise-action@v5

      - name: Check npm can do Trusted Publishing
        # The OIDC exchange needs npm >= 11.5.1; the npm bundled with the
        # mise-pinned Node provides it. Fail here, not at publish time.
        run: |
          npm_version="$(npm --version)"
          echo "npm $npm_version from $(command -v npm)"
          node -e 'const [maj, min] = process.argv[1].split(".").map(Number); process.exit(maj > 11 || (maj === 11 && min >= 5) ? 0 : 1)' "$npm_version" ||
            { echo "npm $npm_version is too old for Trusted Publishing (needs >= 11.5.1)"; exit 1; }

      - name: Install deps
        env:
          YARN_ENABLE_HARDENED_MODE: 'false'
        run: yarn install --immutable

      - name: Build packages
        run: yarn build

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: yarn version-packages
          publish-script: yarn release
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
        env:
          # No NPM_TOKEN: npm CLI does Trusted Publishing via OIDC.
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Create GitHub Releases for major versions only
        # Tags created by changesets/action via the default GITHUB_TOKEN do not
        # trigger separate workflows (GitHub's anti-infinite-loop rule), so we
        # do the GH Release creation inline. Filter: version is X.0.0 with X>=1.
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED: ${{ steps.changesets.outputs.published-packages }}
        run: |
          echo "Published packages: $PUBLISHED"
          echo "$PUBLISHED" | jq -c '.[]' | while read -r entry; do
            name=$(echo "$entry" | jq -r '.name')
            version=$(echo "$entry" | jq -r '.version')
            if [[ "$version" =~ ^([0-9]+)\.0\.0$ ]] && (( BASH_REMATCH[1] >= 1 )); then
              tag="${name}@${version}"
              echo "Promoting $tag to GitHub Release"
              gh release create "$tag" \
                --title "$tag" \
                --generate-notes \
                --latest
            else
              echo "Skipping GitHub Release for $name@$version (not a >=1.0.0 major)"
            fi
          done
