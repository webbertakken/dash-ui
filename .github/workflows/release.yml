name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version + publish
    runs-on: ubuntu-latest
    # Trusted Publishing: id-token: write lets `yarn npm publish` (which
    # `changeset publish` runs per package) exchange a short-lived OIDC token
    # for an npm credential. No NPM_TOKEN secret needed. Provenance comes from
    # each package's publishConfig.provenance.
    # contents: write is for changesets to push tags and the Version Packages PR.
    # pull-requests: write is for opening the Version Packages PR.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Installs (and caches) node and yarn exactly as pinned in mise.toml,
      # ahead of the runner's own on PATH.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5

      - name: Install deps
        env:
          YARN_ENABLE_HARDENED_MODE: 'false'
        run: yarn install --immutable

      - name: Build packages
        run: yarn build

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: yarn version-packages
          publish-script: yarn release
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          # Tags only; the next step creates GitHub Releases for majors.
          create-github-releases: false

      - name: Create GitHub Releases for major versions only
        # Tags created by changesets/action via the default GITHUB_TOKEN do not
        # trigger separate workflows (GitHub's anti-infinite-loop rule), so we
        # do the GH Release creation inline. Filter: version is X.0.0 with X>=1.
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED: ${{ steps.changesets.outputs.published-packages }}
        run: |
          echo "Published packages: $PUBLISHED"
          echo "$PUBLISHED" | jq -c '.[]' | while read -r entry; do
            name=$(echo "$entry" | jq -r '.name')
            version=$(echo "$entry" | jq -r '.version')
            if [[ "$version" =~ ^([0-9]+)\.0\.0$ ]] && (( BASH_REMATCH[1] >= 1 )); then
              tag="${name}@${version}"
              echo "Promoting $tag to GitHub Release"
              gh release create "$tag" \
                --title "$tag" \
                --generate-notes \
                --latest
            else
              echo "Skipping GitHub Release for $name@$version (not a >=1.0.0 major)"
            fi
          done
