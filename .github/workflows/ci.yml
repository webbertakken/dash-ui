name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Installs (and caches) node and yarn exactly as pinned in mise.toml,
      # ahead of the runner's own on PATH.
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5

      - name: Read the Node version mise installed
        id: node
        run: echo "version=$(node --version)" >> "$GITHUB_OUTPUT"

      - name: Resolve yarn cache folder
        id: yarn-config
        run: echo "cacheFolder=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Restore yarn install cache (node_modules + cacheFolder + install-state)
        id: yarn-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            node_modules
            ${{ steps.yarn-config.outputs.cacheFolder }}
            .yarn/install-state.gz
          key:
            yarn-${{ runner.os }}-node${{ steps.node.outputs.version }}-${{ hashFiles('yarn.lock')
            }}
          restore-keys: |
            yarn-${{ runner.os }}-node${{ steps.node.outputs.version }}-

      - name: Install deps
        env:
          YARN_ENABLE_HARDENED_MODE: 'false'
        run: |
          case "$(yarn --version)" in 1.*) echo 'expected up-to-date yarn version'; exit 1 ;; esac
          yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

      - name: Typecheck (shipped packages)
        run: yarn typecheck

      - name: Typecheck (reference dashboards)
        run: yarn typecheck:apps

      - name: Build packages
        # Must run before tests because the @w5-ui/wc registration test
        # imports the built bundle at packages/wc/dist/index.js.
        run: yarn build

      - name: Tests
        run: yarn test

      - name: Build the static tri-framework site (proves all three storybooks build)
        env:
          STORYBOOK_DISABLE_TELEMETRY: '1'
        run: yarn build:site

      - name: Upload site artefact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: apps/storybook-site/dist
          retention-days: 7
